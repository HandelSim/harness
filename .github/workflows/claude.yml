name: Claude

on:
  issues:
    types: [opened, labeled, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Stop redundant runs if events arrive close together on the same issue/PR
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Gates: only run for you, only on issues opted in via `agent:run` label,
    # and only when @claude is mentioned (or label was just added)
    if: |
      (github.event.sender.login == 'HandelSim') &&
      (
        (github.event_name == 'issues' && github.event.action == 'opened' &&
          contains(github.event.issue.labels.*.name, 'agent:run')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'agent:run') ||
        (github.event_name == 'issues' && github.event.action == 'reopened' &&
          contains(github.event.issue.labels.*.name, 'agent:run')) ||
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(github.event.issue.labels.*.name, 'agent:run')) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for branching from dev

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-7

