name: Claude

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event.sender.type != 'Bot') &&
      (
        (github.event_name == 'issues' &&
          contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          # Let users WITHOUT repo write access trigger @claude. The job-level
          # `if:` above already passes any non-Bot mention, but the action runs
          # its own write-permission check on the triggering actor and silently
          # skips non-collaborators unless this is set. '*' = anyone; replace
          # with a comma-separated username list to scope it down.
          allowed_non_write_users: '*'
          base_branch: dev
          branch_prefix: 'agent/'
          claude_args: |
            --model claude-opus-4-7
            --dangerously-skip-permissions
            --allowedTools "Bash,Read,Edit,Write,MultiEdit,Glob,Grep,WebFetch,WebSearch,Task,TodoWrite,NotebookRead,NotebookEdit"
