name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Only one CI run per branch in flight at a time. New pushes cancel the
# in-progress run on dev so we don't waste minutes testing a stale commit
# (and don't fire the auto-fix watcher for an obsolete failure). main
# pushes are infrequent and want full validation, so we still cancel there
# too — the next push will re-run anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 for all JS actions in this workflow.
#
# As of late 2025, GitHub Actions emits a deprecation warning for actions
# that still target Node.js 20 (actions/cache@v4, docker/setup-buildx-action@v3,
# etc.). Node.js 20 will be removed from the runner on 2026-09-16. Setting
# this env var at the workflow level forces every JS-based action invocation
# below to run on Node.js 24, which silences the warnings and prevents a
# surprise breakage when the runner upgrade lands.
#
# Per GitHub: once Node.js 24 becomes the default, this can be removed.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: bash -n syntax check on all shell scripts
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done < <(find harness harness-install.sh scripts tests -type f \
              \( -name '*.sh' -o -path harness -o -path harness-install.sh \) \
              -print0)
          exit $fail

      - name: check_runtime_calls.sh (no raw `docker` calls)
        run: bash scripts/check_runtime_calls.sh

      - name: shellcheck (advisory)
        continue-on-error: true
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./tests
          additional_files: harness harness-install.sh scripts/check_runtime_calls.sh scripts/lib/platform.sh scripts/lib/net_helpers.sh scripts/lib/upgrade_actions.sh

  unit:
    name: unit (upgrade_test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: tests/upgrade_test.sh
        run: bash tests/upgrade_test.sh

  docker-tests:
    name: docker / ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Explicit matrix (one entry per tests/<name>_test.sh). Each test
        # gets its own job + cache key. Convention: any new docker-driven
        # test script under tests/<name>_test.sh should be added here by
        # hand. Glob-based discovery is intentionally avoided so adding a
        # test always triggers an explicit CI review.
        test:
          - harness_test
          - proxy_test
          - persistence_test
          - mcp_test
          - firewall_test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.test }}-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-${{ matrix.test }}-
            buildx-

      - name: Show docker / compose versions
        run: |
          docker --version
          docker compose version

      - name: Run tests/${{ matrix.test }}.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/${{ matrix.test }}.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== docker network ls ==="
          docker network ls || true
          echo "=== free -h ==="
          free -h || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -p harness-mgmt-test down --remove-orphans -v 2>/dev/null || true
          docker system prune -f --volumes || true

  pipeline:
    name: full_pipeline_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-pipeline-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-pipeline-
            buildx-

      - name: tests/full_pipeline_test.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/full_pipeline_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  integration:
    name: integration_test (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-integration-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-integration-
            buildx-

      - name: tests/integration_test.sh
        env:
          HARNESS_RUN_SLOW: "1"
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/integration_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  e2e:
    name: e2e (tmux scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-e2e-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-e2e-
            buildx-

      # Bootstrap config so `./harness start` will bring the stack up.
      # PROXY_API_URL must point at a host that is in the allowlist or the
      # proxy's init-firewall.sh guardrail aborts the container with FATAL
      # before the healthcheck ever runs. api.github.com is in the bundled
      # .harness-allowlist.example, so use it as the placeholder — the
      # proxy never actually calls it because the agents in the scenarios
      # talk to ollama via the intra-cluster name, not the upstream URL.
      - name: Seed harness config
        run: |
          cp .env.example .env
          sed -i 's|^PROXY_API_URL=.*|PROXY_API_URL=https://api.github.com|' .env
          sed -i 's|^PROXY_API_KEY=.*|PROXY_API_KEY=ci-placeholder-key|' .env
          sed -i 's|^PROXY_API_MODEL=.*|PROXY_API_MODEL=ci-placeholder-model|' .env
          # harness source .env with `set -a` on every invocation, so even
          # though we set this on `harness start` below the scenarios'
          # `./harness claude` calls would still hit _gate_on_upstream_auth.
          # Baking the bypass into .env makes every invocation skip it.
          echo 'HARNESS_SKIP_AUTH_PROBE=1' >> .env
          cp .harness-allowlist.example .harness-allowlist
          chmod +x harness

      # Pre-seed claude-code's user state file BEFORE the agent ever starts
      # so that the first-run theme picker / onboarding screen does not appear.
      # Without this, scenario 01-claude-boot.yaml hangs waiting for the
      # prompt marker `│ > ` because claude is still on the picker screen.
      #
      # Cycle 4 wrote hasCompletedOnboarding into ~/.claude/settings.json
      # and the picker still rendered. Disassembling the v2.1.120 binary
      # showed the onboarding gate (QN9) reads from ~/.claude.json (the
      # top-level state file populated by Lq()), not from settings.json.
      # The fields below match what claude itself writes on first run plus
      # hasCompletedOnboarding=true and a project-trust entry for the CI
      # checkout path (claude bind-mounts and cd's into HARNESS_HOST_CWD,
      # which on CI is the runner's repo path).
      #
      # state/agent/home is the host side of the agent's $HOME bind mount;
      # the harness CLI remaps the in-container `harness` user to the host
      # uid/gid so these files are readable inside the container.
      - name: Pre-seed claude-code settings
        run: |
          mkdir -p state/agent/home/.claude
          cat > state/agent/home/.claude/settings.json <<'JSON'
          {"theme":"dark","includeCoAuthoredBy":false}
          JSON
          repo_cwd="${GITHUB_WORKSPACE}"
          cat > state/agent/home/.claude.json <<JSON
          {
            "theme": "dark",
            "hasCompletedOnboarding": true,
            "firstStartTime": "2026-01-01T00:00:00.000Z",
            "migrationVersion": 12,
            "opusProMigrationComplete": true,
            "sonnet1m45MigrationComplete": true,
            "userID": "ci-placeholder-user-id-0000000000000000000000000000000000000000",
            "numStartups": 42,
            "lastOnboardingVersion": {
              "ISSUES_EXPLAINER": "report the issue at https://github.com/anthropics/claude-code/issues",
              "PACKAGE_URL": "@anthropic-ai/claude-code",
              "README_URL": "https://code.claude.com/docs/en/overview",
              "VERSION": "2.1.120",
              "FEEDBACK_CHANNEL": "https://github.com/anthropics/claude-code/issues",
              "BUILD_TIME": "2026-04-24T19:00:00.000Z"
            },
            "projects": {
              "${repo_cwd}": {"hasTrustDialogAccepted": true}
            }
          }
          JSON

      - name: harness start
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          HARNESS_SKIP_AUTH_PROBE: "1"
        run: ./harness start

      # Pre-build the agent image so `./harness claude` inside each scenario
      # finds it already present and does NOT inline-build it. The inline
      # build is ~45s on CI and races the scenarios' 45s wait_for_marker on
      # the claude prompt; the transcripts dumped by Diagnostics on cycle 3
      # showed every scenario stuck on `harness: building harness-agent:latest
      # (one-time)...` and the docker-build output filling the tmux pane.
      - name: Pre-build agent image
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: docker compose --env-file ./.env --profile agent build agent

      # `compose up -d` returns once containers are started, not once their
      # healthchecks have passed. Block here until both core services report
      # healthy so the scenarios don't race the proxy/ollama warm-up.
      - name: Wait for proxy + ollama healthy
        run: |
          for i in $(seq 1 60); do
            proxy_h=$(docker inspect --format '{{.State.Health.Status}}' "$(docker ps -qf name=harness-proxy)" 2>/dev/null || echo "missing")
            ollama_h=$(docker inspect --format '{{.State.Health.Status}}' "$(docker ps -qf name=harness-ollama)" 2>/dev/null || echo "missing")
            echo "tick=${i} proxy=${proxy_h} ollama=${ollama_h}"
            if [[ "${proxy_h}" == "healthy" && "${ollama_h}" == "healthy" ]]; then
              echo "Stack healthy after ${i} ticks"
              exit 0
            fi
            sleep 2
          done
          echo "Stack not healthy in 120s"
          docker ps -a
          docker compose logs || true
          exit 1

      - name: tests/e2e/run.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/e2e/run.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="; docker ps -a || true
          echo "=== docker logs harness-proxy-1 ==="; docker logs harness-proxy-1 2>&1 | tail -100 || true
          echo "=== docker logs harness-ollama-1 ==="; docker logs harness-ollama-1 2>&1 | tail -100 || true
          # Agent containers are ephemeral per-scenario. Dump anything that
          # still has the harness.agent=true label so we can see what
          # claude-code printed when the prompt never appeared.
          for c in $(docker ps -a --filter label=harness.agent=true --format '{{.Names}}' 2>/dev/null); do
            echo "=== docker logs ${c} ==="
            docker logs "${c}" 2>&1 | tail -200 || true
          done
          # tmux pane transcripts land under /tmp/harness-e2e-* — these are
          # the only windows into what the user would have seen on screen.
          for d in /tmp/harness-e2e-*; do
            [[ -d "$d" ]] || continue
            echo "=== contents of ${d} ==="
            ls -la "${d}" || true
            for f in "${d}"/*.transcript.txt "${d}"/*.pipe.log; do
              [[ -f "$f" ]] || continue
              echo "--- ${f} (last 200 lines) ---"
              tail -200 "$f" || true
            done
          done
          echo "=== free -h ==="; free -h || true
          echo "=== df -h ==="; df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  scheme_contract:
    name: scheme_contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-scheme-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-scheme-
            buildx-

      - name: tests/scheme_contract_test.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/scheme_contract_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="; docker ps -a || true
          echo "=== df -h ==="; df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  # ---------------------------------------------------------------------------
  # Auto-fix on failure (inlined from the former ci-failure-claude.yml watcher).
  #
  # Why inline instead of a separate `workflow_run` watcher: GitHub only fires
  # `workflow_run` for workflow files that live on the default branch (`main`).
  # The watcher previously lived only on `dev`, so it never registered and no
  # auto-fix issue was created when CI failed on dev. Inlining sidesteps the
  # default-branch trap entirely — `push: dev` triggers fire from any branch,
  # so this just works.
  #
  # The two jobs below preserve the watcher's original semantic split:
  #   1) failure_triage — always logs the failure on a dedupe-by-SHA issue
  #      and counts attempts. Runs even after the 5-cap is hit so reruns of
  #      the same failing SHA still get a paper trail.
  #   2) failure_invoke_claude — runs only when the triage cap allows it,
  #      and bypasses the `@claude`-mention sender gate by invoking
  #      `claude-code-action` directly.
  # ---------------------------------------------------------------------------

  failure_triage:
    name: Auto-fix on failure (triage)
    needs: [lint, unit, docker-tests, pipeline, integration, e2e, scheme_contract]
    if: >-
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
      should_invoke: ${{ steps.cap.outputs.should_invoke }}
      sha: ${{ steps.ctx.outputs.sha }}
      sha7: ${{ steps.ctx.outputs.sha7 }}
      run_url: ${{ steps.ctx.outputs.run_url }}
    steps:
      - name: Checkout (for log fetch + git author check)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}

      - name: Build context
        id: ctx
        env:
          SHA: ${{ github.sha }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "sha=${SHA}"           >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA:0:7}"      >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}"   >> "$GITHUB_OUTPUT"

      - name: Skip if last dev commit was bot-authored
        # If the most recent commit on dev is from the auto-fix loop, that
        # means a Claude run is already in flight or just landed. Re-firing
        # would race or stack a redundant attempt; bail out and let the
        # next push (which will produce a new SHA + new issue) handle it.
        id: bot_check
        run: |
          author_email="$(git log -1 --pretty='%ae' "${{ steps.ctx.outputs.sha }}")"
          author_name="$(git log -1 --pretty='%an' "${{ steps.ctx.outputs.sha }}")"
          echo "Last commit author: ${author_name} <${author_email}>"
          if [[ "${author_email}" == *"claude[bot]"* ]] \
              || [[ "${author_email}" == *"users.noreply.github.com"* && "${author_name}" == *"claude"* ]] \
              || [[ "${author_name}" == "claude[bot]" ]]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find or create the failure issue
        if: steps.bot_check.outputs.skip != 'true'
        id: issue
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          SHA7: ${{ steps.ctx.outputs.sha7 }}
          SHA: ${{ steps.ctx.outputs.sha }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          set -euo pipefail
          title="CI failure on dev: ${SHA7}"
          # gh issue list with --search "in:title" matches loosely; use
          # exact-title check on the JSON output.
          existing="$(gh issue list \
              --state open \
              --label ci-failure \
              --search "${title} in:title" \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n1)"
          if [[ -n "${existing}" ]]; then
            echo "Found existing issue #${existing}"
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
            echo "created=false"      >> "$GITHUB_OUTPUT"
          else
            body=$(cat <<EOF
          A CI run on \`dev\` failed at commit [\`${SHA7}\`](https://github.com/${{ github.repository }}/commit/${SHA}).

          - Failed run: ${RUN_URL}
          - Triggered by: inline \`failure_triage\` job in the CI workflow

          The auto-fix workflow will append failed-step logs as a comment and
          (per CLAUDE.md "When triggered by a CI failure") invoke Claude to
          investigate and push a fix directly to \`dev\`.

          If five attempts on this SHA have already failed, the watcher
          stops triggering and pings @HandelSim for review.
          EOF
          )
            num="$(gh issue create \
                --title "${title}" \
                --label ci-failure \
                --body "${body}" \
              | grep -oE '/issues/[0-9]+' | grep -oE '[0-9]+' | head -n1)"
            echo "Created issue #${num}"
            echo "number=${num}"   >> "$GITHUB_OUTPUT"
            echo "created=true"    >> "$GITHUB_OUTPUT"
          fi

      - name: Append failed-step logs to the issue
        if: steps.bot_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          ISSUE: ${{ steps.issue.outputs.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # gh run view --log-failed prints only failed-step output. Cap at
          # the last ~400 lines so giant test outputs don't blow up the
          # comment body or the prompt context.
          gh run view "${RUN_ID}" --log-failed > "$tmp" 2>&1 || true
          tail_lines=400
          tail -n "${tail_lines}" "$tmp" > "${tmp}.tail"
          {
            echo "<!-- ci-failure-attempt run-${RUN_ID} -->"
            echo "### CI failure: run [${RUN_ID}](${RUN_URL})"
            echo
            echo "Tail (\`last ${tail_lines}\` lines) of failed-step logs:"
            echo
            echo '```'
            cat "${tmp}.tail"
            echo '```'
          } > "${tmp}.comment"
          gh issue comment "${ISSUE}" --body-file "${tmp}.comment"

      - name: Per-SHA attempt cap (max 5)
        if: steps.bot_check.outputs.skip != 'true'
        id: cap
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          # Count attempt markers on the issue. Each watcher-fired comment
          # carries `<!-- ci-failure-attempt run-... -->`; that's our
          # canonical attempt counter (it's what gets logged regardless of
          # whether Claude was actually invoked, so reruns of the same
          # failing SHA still count).
          count="$(gh issue view "${ISSUE}" --json comments \
              --jq '[.comments[] | select(.body | contains("<!-- ci-failure-attempt"))] | length')"
          echo "Attempt comments on issue #${ISSUE}: ${count}"
          if [[ "${count}" -gt 5 ]]; then
            gh issue comment "${ISSUE}" --body \
              "**Auto-fix loop disengaged.** Per-SHA attempt cap (5) reached: this SHA has had 5 unsuccessful Claude attempts and the watcher will not invoke a 6th. The loop has stopped — it has NOT silently succeeded. Land a new commit on \`dev\` to reset the cap (a new SHA produces a new issue and a fresh attempt counter), or escalate manually. @HandelSim please review."
            echo "should_invoke=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_invoke=true"  >> "$GITHUB_OUTPUT"
          fi

  failure_invoke_claude:
    name: Auto-fix on failure (invoke Claude)
    needs: failure_triage
    if: needs.failure_triage.outputs.should_invoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          ref: dev

      - name: Run Claude (auto-fix mode)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          base_branch: dev
          branch_prefix: 'agent/'
          track_progress: true
          prompt: |
            A CI test failed on `dev`. Operate per the
            "When triggered by a CI failure (label: `ci-failure`)"
            section of CLAUDE.md.

            Context:
            - Issue: #${{ needs.failure_triage.outputs.issue_number }}
            - Repository: ${{ github.repository }}
            - Dev SHA at failure: ${{ needs.failure_triage.outputs.sha }} (`${{ needs.failure_triage.outputs.sha7 }}`)
            - Failed CI run: ${{ needs.failure_triage.outputs.run_url }}

            ## Diagnose before you change anything

            The failed-step log excerpt in the issue is **starting** evidence,
            not ending evidence. Past auto-fix runs have failed because they
            jumped to "what symbol in the log can I change to make the
            assertion match" instead of asking "what is actually being
            produced, and why does it disagree with the assertion."

            Before proposing any fix, do at least these:

            1. **Read the raw output from the failing layer, not just the
               assertion message.** Examples of what "raw" means:
                 - For e2e tmux tests: dump the per-scenario `pipe.log` byte
                   stream (`tests/e2e/lib/run_scenario.py` writes one with
                   `tmux pipe-pane`). `tmux capture-pane -p` strips trailing
                   whitespace and collapses styling, so it can lie about
                   what the TUI emitted. The pipe.log does not.
                 - For HTTP/proxy tests: dump the request/response body,
                   not just the status code.
                 - For container/process tests: dump the container logs
                   (`docker logs`, `journalctl`) and any state-dir contents
                   the test produced. The harness e2e job already does this
                   on failure; **read those artifacts** before changing code.
                 - For Python tests: run with `-x -vv -s` locally and read
                   what was actually printed.
            2. **Reproduce locally if reproduction is cheap** (under ~5 min
               to set up). Most harness test failures reproduce in a fresh
               container or a fresh checkout. If reproduction is expensive,
               state that and proceed with log-only analysis.
            3. **Name the root cause in one sentence before writing any
               fix.** If you can't, you haven't diagnosed it — keep reading.
               "The assertion expects X but got Y" is not a root cause; the
               root cause is *why* Y was produced.
            4. **Stress-test your fix against the evidence.** If your fix is
               "change the assertion / increase the timeout / loosen the
               match," ask whether you've actually understood why the
               original assertion failed. Loosening a check should be a
               deliberate decision, not a way to make the failure go away.

            ### Anti-patterns to avoid

            These are real failure modes from prior auto-fix attempts.
            If you catch yourself doing one of these, stop and re-read
            the raw evidence:

            - **Timeout bumping.** If a `wait_for_marker` times out and the
              process is clearly alive, the marker is probably wrong, not
              the timeout. Read the captured pane (and the pipe.log byte
              stream) before raising `timeout_s`.
            - **Marker rewriting by guesswork.** Don't try variants of an
              expected string until one matches. Look at what was actually
              emitted and write the marker against that.
            - **Single-tool tunnel vision.** If `tmux capture-pane` shows
              one thing and the test still fails, check what other capture
              paths (the pipe.log, `docker logs`, the agent's own stderr)
              say. They can disagree, and the disagreement is the clue.
            - **Adding retries to mask flakes.** A retry is only correct
              when you've identified a transient cause (network blip,
              clock-skew, etc.). "Sometimes it fails" is not a transient
              cause; it's a symptom of one.

            ## Then fix it

            Once you have a named root cause, fix the underlying problem
            and push to `dev` via the standard rebase + `--ff-only` flow.
            Close the issue with: the fix summary, the root cause sentence
            from step 3, the commit SHA, and a link to the originally
            failing run.

            If after full investigation the failure falls into the
            "Must fall back to research-and-propose" list (security-relevant
            code, public API change, multiple plausible root causes after
            investigation, etc.), comment your proposal on the issue and
            stop — do not push.

            The 5-attempt-per-SHA cap is enforced upstream by the watcher,
            but you should still self-cap as instructed in CLAUDE.md.
          claude_args: |
            --model claude-opus-4-7
            --dangerously-skip-permissions
            --allowedTools "Bash,Read,Edit,Write,MultiEdit,Glob,Grep,WebFetch,WebSearch,Task,TodoWrite,NotebookRead,NotebookEdit"
