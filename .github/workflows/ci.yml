name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Only one CI run per branch in flight at a time. New pushes cancel the
# in-progress run on dev so we don't waste minutes testing a stale commit
# (and don't fire the auto-fix watcher for an obsolete failure). main
# pushes are infrequent and want full validation, so we still cancel there
# too — the next push will re-run anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 for all JS actions in this workflow.
#
# As of late 2025, GitHub Actions emits a deprecation warning for actions
# that still target Node.js 20 (actions/cache@v4, docker/setup-buildx-action@v3,
# etc.). Node.js 20 will be removed from the runner on 2026-09-16. Setting
# this env var at the workflow level forces every JS-based action invocation
# below to run on Node.js 24, which silences the warnings and prevents a
# surprise breakage when the runner upgrade lands.
#
# Per GitHub: once Node.js 24 becomes the default, this can be removed.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: bash -n syntax check on all shell scripts
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done < <(find harness harness-install.sh scripts tests -type f \
              \( -name '*.sh' -o -path harness -o -path harness-install.sh \) \
              -print0)
          exit $fail

      - name: check_runtime_calls.sh (no raw `docker` calls)
        run: bash scripts/check_runtime_calls.sh

      - name: shellcheck (advisory)
        continue-on-error: true
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./tests
          additional_files: harness harness-install.sh scripts/check_runtime_calls.sh scripts/lib/platform.sh scripts/lib/net_helpers.sh scripts/lib/upgrade_actions.sh

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Drive the wrapper's `unit` section instead of a single hardcoded
      # file. It globs upgrade_test.sh + every unit_*_test.sh, so new
      # docker-free unit tests are picked up without editing CI (closes the
      # gap where tests/unit_platform_timer_test.sh ran locally but never
      # in CI). These tests need no docker, so a bare checkout suffices.
      - name: harness test unit
        run: bash ./harness test unit

  docker-tests:
    name: docker / ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Explicit matrix (one entry per tests/<name>_test.sh). Each test
        # gets its own job + cache key. Convention: any new docker-driven
        # test script under tests/<name>_test.sh should be added here by
        # hand. Glob-based discovery is intentionally avoided so adding a
        # test always triggers an explicit CI review.
        test:
          - harness_test
          - proxy_test
          - persistence_test
          - mcp_test
          - firewall_test
    steps:
      - uses: actions/checkout@v5

      # mcp_test auto-builds the full proxy+ollama+agent image set, whose
      # buildx tar-exports peak at ~2x each image and overflow the runner's
      # default `/` data-root (~8 GB free) with "no space left on device".
      # Point the daemon at `/mnt` (~66 GB) before buildx starts — identical
      # to the step the integration job already runs. Must run before "Set up
      # Docker Buildx" so the builder inherits the relocated daemon. (See
      # issues #78, #96.)
      - name: Relocate Docker data-root to /mnt (66 GB free vs ~8 GB on /)
        run: |
          sudo systemctl stop docker.service docker.socket
          sudo mkdir -p /mnt/docker
          sudo rm -rf /var/lib/docker
          printf '{ "data-root": "/mnt/docker" }\n' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker.service
          docker info --format '{{.DockerRootDir}}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.test }}-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-${{ matrix.test }}-
            buildx-

      - name: Show docker / compose versions
        run: |
          docker --version
          docker compose version

      - name: Run tests/${{ matrix.test }}.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/${{ matrix.test }}.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== docker network ls ==="
          docker network ls || true
          echo "=== free -h ==="
          free -h || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -p harness-mgmt-test down --remove-orphans -v 2>/dev/null || true
          docker system prune -f --volumes || true

  pipeline:
    name: full_pipeline_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # full_pipeline_test builds the full proxy+ollama+agent image set, whose
      # buildx tar-exports peak at ~2x each image and overflow the runner's
      # default `/` data-root (~8 GB free) with "no space left on device".
      # Point the daemon at `/mnt` (~66 GB) before buildx starts — identical
      # to the step the integration job already runs. Must run before "Set up
      # Docker Buildx" so the builder inherits the relocated daemon. (See
      # issues #78, #96.)
      - name: Relocate Docker data-root to /mnt (66 GB free vs ~8 GB on /)
        run: |
          sudo systemctl stop docker.service docker.socket
          sudo mkdir -p /mnt/docker
          sudo rm -rf /var/lib/docker
          printf '{ "data-root": "/mnt/docker" }\n' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker.service
          docker info --format '{{.DockerRootDir}}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-pipeline-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-pipeline-
            buildx-

      - name: tests/full_pipeline_test.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/full_pipeline_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  integration:
    name: integration_test (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The slow integration job pre-builds the multi-GB proxy/ollama/agent
      # images. The runner's default Docker data-root lives on `/`, which only
      # has ~8 GB free, while the `/mnt` volume sits idle with ~66 GB. The
      # buildx docker-container driver tar-exports each image on load, so peak
      # disk is ~2x each image and `/` overflows with "no space left on
      # device". Point the daemon at `/mnt` before anything builds. Must run
      # before "Set up Docker Buildx" so the buildx builder inherits the
      # relocated daemon. (See issue #78.)
      - name: Relocate Docker data-root to /mnt (66 GB free vs ~8 GB on /)
        run: |
          sudo systemctl stop docker.service docker.socket
          sudo mkdir -p /mnt/docker
          sudo rm -rf /var/lib/docker
          printf '{ "data-root": "/mnt/docker" }\n' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker.service
          docker info --format '{{.DockerRootDir}}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-integration-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-integration-
            buildx-

      - name: tests/integration_test.sh
        env:
          HARNESS_RUN_SLOW: "1"
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/integration_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  scheme_contract:
    name: scheme_contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-scheme-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-scheme-
            buildx-

      - name: tests/scheme_contract_test.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/scheme_contract_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="; docker ps -a || true
          echo "=== df -h ==="; df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  # ---------------------------------------------------------------------------
  # Auto-fix on failure (inlined from the former ci-failure-claude.yml watcher).
  #
  # Why inline instead of a separate `workflow_run` watcher: GitHub only fires
  # `workflow_run` for workflow files that live on the default branch (`main`).
  # The watcher previously lived only on `dev`, so it never registered and no
  # auto-fix issue was created when CI failed on dev. Inlining sidesteps the
  # default-branch trap entirely — `push: dev` triggers fire from any branch,
  # so this just works.
  #
  # The two jobs below preserve the watcher's original semantic split:
  #   1) failure_triage — always logs the failure on a dedupe-by-SHA issue
  #      and counts attempts. Runs even after the 5-cap is hit so reruns of
  #      the same failing SHA still get a paper trail.
  #   2) failure_invoke_claude — runs only when the triage cap allows it,
  #      and bypasses the `@claude`-mention sender gate by invoking
  #      `claude-code-action` directly.
  # ---------------------------------------------------------------------------

  failure_triage:
    name: Auto-fix on failure (triage)
    needs: [lint, unit, docker-tests, pipeline, integration, scheme_contract]
    if: >-
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    # No job-level outputs: this job's effects are emitted via GitHub issue
    # comments (which fire claude.yml), not via outputs to a downstream job.
    steps:
      - name: Checkout (for log fetch + git author check)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}

      - name: Build context
        id: ctx
        env:
          SHA: ${{ github.sha }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "sha=${SHA}"           >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA:0:7}"      >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}"   >> "$GITHUB_OUTPUT"

      - name: Check cap on any existing issue for this SHA
        # Run cap-counting BEFORE issue creation so we can gate the @claude
        # mention. If we let create/append run first and only checked the
        # cap afterwards, we'd already have fired claude.yml on the cap-
        # exceeded path. Output `cap_ok` is consumed by every step below.
        #
        # NOTE: there used to be a "Skip if last dev commit was bot-authored"
        # step ahead of this one. It killed the self-healing loop: once
        # claude[bot] lands ANY commit on dev (which it does whenever the
        # auto-fix flow succeeds at pushing), every subsequent CI failure on
        # dev was silently dropped and no issue was ever created. The cap
        # below (5 attempts per SHA) is the only runaway guard we need —
        # each new push produces a new SHA with a fresh cap. See issue #49.
        id: precap
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          SHA7: ${{ steps.ctx.outputs.sha7 }}
        run: |
          set -euo pipefail
          title="CI failure on dev: ${SHA7}"
          existing="$(gh issue list \
              --state open \
              --label ci-failure \
              --search "${title} in:title" \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n1)"
          if [[ -z "${existing}" ]]; then
            echo "No existing issue for SHA ${SHA7}; cap_ok=true (count=0)."
            echo "existing="          >> "$GITHUB_OUTPUT"
            echo "is_new=true"        >> "$GITHUB_OUTPUT"
            echo "cap_ok=true"        >> "$GITHUB_OUTPUT"
            echo "attempt_count=0"    >> "$GITHUB_OUTPUT"
          else
            count="$(gh issue view "${existing}" --json comments \
                --jq '[.comments[] | select(.body | contains("<!-- ci-failure-attempt"))] | length')"
            echo "Existing issue #${existing}: ${count} prior attempts."
            echo "existing=${existing}"     >> "$GITHUB_OUTPUT"
            echo "is_new=false"             >> "$GITHUB_OUTPUT"
            echo "attempt_count=${count}"   >> "$GITHUB_OUTPUT"
            if [[ "${count}" -gt 5 ]]; then
              echo "cap_ok=false" >> "$GITHUB_OUTPUT"
            else
              echo "cap_ok=true"  >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Find or create the failure issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          SHA7: ${{ steps.ctx.outputs.sha7 }}
          SHA: ${{ steps.ctx.outputs.sha }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
          EXISTING: ${{ steps.precap.outputs.existing }}
          IS_NEW: ${{ steps.precap.outputs.is_new }}
        run: |
          set -euo pipefail
          title="CI failure on dev: ${SHA7}"
          if [[ "${IS_NEW}" == "false" ]]; then
            echo "Found existing issue #${EXISTING}"
            echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"
            echo "created=false"      >> "$GITHUB_OUTPUT"
          else
            # NOTE: this body intentionally contains `@claude` so the existing
            # `claude.yml` workflow (which fires on issues.opened with @claude
            # in the body, from sender HandelSim) picks up the failure and
            # invokes claude-code-action. The inline failure_invoke_claude
            # approach (calling the action directly from a push-event workflow)
            # is unsupported by the action: "Unsupported event type: push".
            body=$(cat <<EOF
          @claude — a CI run on \`dev\` failed at commit [\`${SHA7}\`](https://github.com/${{ github.repository }}/commit/${SHA}).

          - Failed run: ${RUN_URL}
          - Triggered by: inline \`failure_triage\` job in the CI workflow

          Please investigate and fix per the "When triggered by a CI failure
          (label: \`ci-failure\`)" section of CLAUDE.md.

          ## Diagnose before you change anything

          The failed-step log excerpt appended below is **starting** evidence,
          not ending evidence. Prior auto-fix attempts have stalled by jumping
          to "what symbol can I change to make the assertion match" instead of
          asking "what is actually being produced, and why does it disagree."

          Before proposing any fix, do at least these:

          1. **Read the raw output from the failing layer.** Examples:
             - HTTP/proxy: dump the request/response body, not just status.
             - Container/process: \`docker logs\`, state-dir contents. The
               docker-backed jobs already dump these on failure — read those
               artifacts.
             - Python tests: rerun with \`-x -vv -s\` and read what was printed.
          2. **Reproduce locally if cheap.** Most harness failures reproduce in
             a fresh container or checkout. If reproduction is expensive, say
             so and proceed with log-only analysis.
          3. **Name the root cause in one sentence before writing any fix.** If
             you can't, you haven't diagnosed it. "Assertion expected X, got Y"
             is the symptom; the root cause is *why* Y was produced.
          4. **Stress-test your fix.** If the fix is "raise timeout / loosen
             match / add retry," ask whether you've actually understood *why*
             the original assertion failed. Loosening is a deliberate choice,
             not a way to make a red light go away.

          ### Anti-patterns from prior failed attempts

          - **Timeout/wait bumping.** If a wait or healthcheck loop times out
            while the process is alive, the thing being waited for is probably
            wrong, not the timeout.
          - **Assertion rewriting by guesswork.** Don't iterate string
            variants until one matches; read what was actually emitted.
          - **Single-tool tunnel vision.** Two views of the same output (e.g.
            captured stdout vs a log file) can disagree; the disagreement is
            the clue.
          - **Retry-as-flake-mask.** A retry is only right with a named
            transient cause. "Sometimes fails" is the symptom of one.

          ## Then fix it

          With a named root cause, fix the underlying problem and push to
          \`dev\` via the standard rebase + \`--ff-only\` flow. Close this
          issue with the fix summary, the root-cause sentence, commit SHA,
          and a link to the originally-failing run.

          If after investigation the failure falls into the "Must fall back
          to research-and-propose" list (security-relevant code, public API
          change, multiple plausible root causes after investigation, etc.),
          comment your proposal here and stop.

          If five attempts on this SHA have already failed, the watcher
          stops triggering and pings @HandelSim for review.
          EOF
          )
            num="$(gh issue create \
                --title "${title}" \
                --label ci-failure \
                --body "${body}" \
              | grep -oE '/issues/[0-9]+' | grep -oE '[0-9]+' | head -n1)"
            echo "Created issue #${num}"
            echo "number=${num}"   >> "$GITHUB_OUTPUT"
            echo "created=true"    >> "$GITHUB_OUTPUT"
          fi

      - name: Append failed-step logs to the issue
        id: append_logs
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          ISSUE: ${{ steps.issue.outputs.number }}
          IS_NEW: ${{ steps.precap.outputs.is_new }}
          CAP_OK: ${{ steps.precap.outputs.cap_ok }}
          ATTEMPT_COUNT: ${{ steps.precap.outputs.attempt_count }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # gh run view --log-failed prints only failed-step output. Cap at
          # the last ~400 lines so giant test outputs don't blow up the
          # comment body or the prompt context.
          gh run view "${RUN_ID}" --log-failed > "$tmp" 2>&1 || true
          tail_lines=400
          tail -n "${tail_lines}" "$tmp" > "${tmp}.tail"
          # Decide whether to @-mention claude in this comment.
          #
          # - Brand-new issue this run: the @claude mention is already in the
          #   issue body; `issues.opened` event will fire claude.yml. Don't
          #   stack a redundant invocation here.
          # - Existing issue, cap_ok=true: this is the trigger event for a
          #   rerun on the same SHA — include @claude so the issue_comment
          #   event fires claude.yml.
          # - Existing issue, cap_ok=false: cap has been hit. Do NOT include
          #   @claude. The dedicated "post cap-reached comment" step below
          #   posts a separate (also @claude-free) "loop disengaged" notice.
          if [[ "${IS_NEW}" == "true" ]]; then
            mention=""
          elif [[ "${CAP_OK}" == "true" ]]; then
            mention="@claude — retry on this same SHA (prior attempts: ${ATTEMPT_COUNT}). See the new log tail below."
          else
            mention=""
          fi
          {
            echo "<!-- ci-failure-attempt run-${RUN_ID} -->"
            if [[ -n "${mention}" ]]; then
              echo "${mention}"
              echo
            fi
            echo "### CI failure: run [${RUN_ID}](${RUN_URL})"
            echo
            echo "Tail (\`last ${tail_lines}\` lines) of failed-step logs:"
            echo
            echo '```'
            cat "${tmp}.tail"
            echo '```'
          } > "${tmp}.comment"
          gh issue comment "${ISSUE}" --body-file "${tmp}.comment"

      - name: Post cap-reached notice if cap was hit
        # When the precap step decided cap_ok=false, post a clearly-labeled
        # "loop disengaged" comment with NO @claude mention. This is the only
        # signal to a human reader that the loop has stopped — without it,
        # the appended log comment alone looks like a normal retry log.
        if: steps.precap.outputs.cap_ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          ISSUE: ${{ steps.issue.outputs.number }}
          ATTEMPT_COUNT: ${{ steps.precap.outputs.attempt_count }}
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE}" --body \
            "**Auto-fix loop disengaged.** Per-SHA attempt cap (5) reached: ${ATTEMPT_COUNT} unsuccessful Claude attempts on this SHA. The watcher will not fire claude.yml again for this issue. The loop has stopped — it has NOT silently succeeded. Land a new commit on \`dev\` to reset the cap (a new SHA produces a new issue and a fresh attempt counter), or escalate manually. @HandelSim please review."

