name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Only one CI run per branch in flight at a time. New pushes cancel the
# in-progress run on dev so we don't waste minutes testing a stale commit
# (and don't fire the auto-fix watcher for an obsolete failure). main
# pushes are infrequent and want full validation, so we still cancel there
# too — the next push will re-run anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 for all JS actions in this workflow.
#
# As of late 2025, GitHub Actions emits a deprecation warning for actions
# that still target Node.js 20 (actions/cache@v4, docker/setup-buildx-action@v3,
# etc.). Node.js 20 will be removed from the runner on 2026-09-16. Setting
# this env var at the workflow level forces every JS-based action invocation
# below to run on Node.js 24, which silences the warnings and prevents a
# surprise breakage when the runner upgrade lands.
#
# Per GitHub: once Node.js 24 becomes the default, this can be removed.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: bash -n syntax check on all shell scripts
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done < <(find harness harness-install.sh scripts tests -type f \
              \( -name '*.sh' -o -path harness -o -path harness-install.sh \) \
              -print0)
          exit $fail

      - name: check_runtime_calls.sh (no raw `docker` calls)
        run: bash scripts/check_runtime_calls.sh

      - name: shellcheck (advisory)
        continue-on-error: true
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./tests
          additional_files: harness harness-install.sh scripts/check_runtime_calls.sh scripts/lib/platform.sh scripts/lib/net_helpers.sh scripts/lib/upgrade_actions.sh

  unit:
    name: unit (upgrade_test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: tests/upgrade_test.sh
        run: bash tests/upgrade_test.sh

  docker-tests:
    name: docker / ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Explicit matrix (one entry per tests/<name>_test.sh). Each test
        # gets its own job + cache key. Convention: any new docker-driven
        # test script under tests/<name>_test.sh should be added here by
        # hand. Glob-based discovery is intentionally avoided so adding a
        # test always triggers an explicit CI review.
        test:
          - harness_test
          - proxy_test
          - persistence_test
          - mcp_test
          - firewall_test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.test }}-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-${{ matrix.test }}-
            buildx-

      - name: Show docker / compose versions
        run: |
          docker --version
          docker compose version

      - name: Run tests/${{ matrix.test }}.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/${{ matrix.test }}.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== docker network ls ==="
          docker network ls || true
          echo "=== free -h ==="
          free -h || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -p harness-mgmt-test down --remove-orphans -v 2>/dev/null || true
          docker system prune -f --volumes || true

  pipeline:
    name: full_pipeline_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-pipeline-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-pipeline-
            buildx-

      - name: tests/full_pipeline_test.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/full_pipeline_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  integration:
    name: integration_test (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-integration-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-integration-
            buildx-

      - name: tests/integration_test.sh
        env:
          HARNESS_RUN_SLOW: "1"
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/integration_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== df -h ==="
          df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  e2e:
    name: e2e (tmux scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-e2e-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-e2e-
            buildx-

      # Bootstrap config so `./harness start` will bring the stack up.
      # The scenarios override PROXY_API_URL/KEY/MODEL with mock values
      # inside the tmux session — these placeholders only need to be
      # non-empty for preflight to accept the .env.
      - name: Seed harness config
        run: |
          cp .env.example .env
          sed -i 's|^PROXY_API_URL=.*|PROXY_API_URL=https://api.example.test|' .env
          sed -i 's|^PROXY_API_KEY=.*|PROXY_API_KEY=ci-placeholder-key|' .env
          sed -i 's|^PROXY_API_MODEL=.*|PROXY_API_MODEL=ci-placeholder-model|' .env
          cp .harness-allowlist.example .harness-allowlist
          chmod +x harness

      # Pre-seed claude-code's settings.json BEFORE the agent ever starts so
      # that the first-run theme picker / onboarding screen does not appear.
      # Without this, scenario 01-claude-boot.yaml hangs waiting for the
      # prompt marker `│ > ` because claude is still on the picker screen.
      # state/agent/home is the host side of the agent's $HOME bind mount;
      # the harness CLI remaps the in-container `harness` user to the host
      # uid/gid so this file is readable inside the container.
      - name: Pre-seed claude-code settings
        run: |
          mkdir -p state/agent/home/.claude
          cat > state/agent/home/.claude/settings.json <<'JSON'
          {"theme":"dark","includeCoAuthoredBy":false,"hasCompletedOnboarding":true}
          JSON

      - name: harness start
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          HARNESS_SKIP_AUTH_PROBE: "1"
        run: ./harness start

      # `compose up -d` returns once containers are started, not once their
      # healthchecks have passed. Block here until both core services report
      # healthy so the scenarios don't race the proxy/ollama warm-up.
      - name: Wait for proxy + ollama healthy
        run: |
          for i in $(seq 1 60); do
            proxy_h=$(docker inspect --format '{{.State.Health.Status}}' "$(docker ps -qf name=harness-proxy)" 2>/dev/null || echo "missing")
            ollama_h=$(docker inspect --format '{{.State.Health.Status}}' "$(docker ps -qf name=harness-ollama)" 2>/dev/null || echo "missing")
            echo "tick=${i} proxy=${proxy_h} ollama=${ollama_h}"
            if [[ "${proxy_h}" == "healthy" && "${ollama_h}" == "healthy" ]]; then
              echo "Stack healthy after ${i} ticks"
              exit 0
            fi
            sleep 2
          done
          echo "Stack not healthy in 120s"
          docker ps -a
          docker compose logs || true
          exit 1

      - name: tests/e2e/run.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/e2e/run.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="; docker ps -a || true
          echo "=== free -h ==="; free -h || true
          echo "=== df -h ==="; df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  scheme_contract:
    name: scheme_contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Buildx layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-scheme-${{ hashFiles('agents/Dockerfile', 'proxy/Dockerfile', 'ollama/Dockerfile', 'firewall/**', 'docker-compose.yml') }}
          restore-keys: |
            buildx-scheme-
            buildx-

      - name: tests/scheme_contract_test.sh
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: bash tests/scheme_contract_test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="; docker ps -a || true
          echo "=== df -h ==="; df -h || true

      - name: Cleanup
        if: always()
        run: docker system prune -f --volumes || true

  # ---------------------------------------------------------------------------
  # Auto-fix on failure (inlined from the former ci-failure-claude.yml watcher).
  #
  # Why inline instead of a separate `workflow_run` watcher: GitHub only fires
  # `workflow_run` for workflow files that live on the default branch (`main`).
  # The watcher previously lived only on `dev`, so it never registered and no
  # auto-fix issue was created when CI failed on dev. Inlining sidesteps the
  # default-branch trap entirely — `push: dev` triggers fire from any branch,
  # so this just works.
  #
  # The two jobs below preserve the watcher's original semantic split:
  #   1) failure_triage — always logs the failure on a dedupe-by-SHA issue
  #      and counts attempts. Runs even after the 5-cap is hit so reruns of
  #      the same failing SHA still get a paper trail.
  #   2) failure_invoke_claude — runs only when the triage cap allows it,
  #      and bypasses the `@claude`-mention sender gate by invoking
  #      `claude-code-action` directly.
  # ---------------------------------------------------------------------------

  failure_triage:
    name: Auto-fix on failure (triage)
    needs: [lint, unit, docker-tests, pipeline, integration, e2e, scheme_contract]
    if: >-
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    outputs:
      issue_number: ${{ steps.issue.outputs.number }}
      should_invoke: ${{ steps.cap.outputs.should_invoke }}
      sha: ${{ steps.ctx.outputs.sha }}
      sha7: ${{ steps.ctx.outputs.sha7 }}
      run_url: ${{ steps.ctx.outputs.run_url }}
    steps:
      - name: Checkout (for log fetch + git author check)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}

      - name: Build context
        id: ctx
        env:
          SHA: ${{ github.sha }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "sha=${SHA}"           >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA:0:7}"      >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}"   >> "$GITHUB_OUTPUT"

      - name: Skip if last dev commit was bot-authored
        # If the most recent commit on dev is from the auto-fix loop, that
        # means a Claude run is already in flight or just landed. Re-firing
        # would race or stack a redundant attempt; bail out and let the
        # next push (which will produce a new SHA + new issue) handle it.
        id: bot_check
        run: |
          author_email="$(git log -1 --pretty='%ae' "${{ steps.ctx.outputs.sha }}")"
          author_name="$(git log -1 --pretty='%an' "${{ steps.ctx.outputs.sha }}")"
          echo "Last commit author: ${author_name} <${author_email}>"
          if [[ "${author_email}" == *"claude[bot]"* ]] \
              || [[ "${author_email}" == *"users.noreply.github.com"* && "${author_name}" == *"claude"* ]] \
              || [[ "${author_name}" == "claude[bot]" ]]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find or create the failure issue
        if: steps.bot_check.outputs.skip != 'true'
        id: issue
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          SHA7: ${{ steps.ctx.outputs.sha7 }}
          SHA: ${{ steps.ctx.outputs.sha }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          set -euo pipefail
          title="CI failure on dev: ${SHA7}"
          # gh issue list with --search "in:title" matches loosely; use
          # exact-title check on the JSON output.
          existing="$(gh issue list \
              --state open \
              --label ci-failure \
              --search "${title} in:title" \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n1)"
          if [[ -n "${existing}" ]]; then
            echo "Found existing issue #${existing}"
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
            echo "created=false"      >> "$GITHUB_OUTPUT"
          else
            body=$(cat <<EOF
          A CI run on \`dev\` failed at commit [\`${SHA7}\`](https://github.com/${{ github.repository }}/commit/${SHA}).

          - Failed run: ${RUN_URL}
          - Triggered by: inline \`failure_triage\` job in the CI workflow

          The auto-fix workflow will append failed-step logs as a comment and
          (per CLAUDE.md "When triggered by a CI failure") invoke Claude to
          investigate and push a fix directly to \`dev\`.

          If five attempts on this SHA have already failed, the watcher
          stops triggering and pings @HandelSim for review.
          EOF
          )
            num="$(gh issue create \
                --title "${title}" \
                --label ci-failure \
                --body "${body}" \
              | grep -oE '/issues/[0-9]+' | grep -oE '[0-9]+' | head -n1)"
            echo "Created issue #${num}"
            echo "number=${num}"   >> "$GITHUB_OUTPUT"
            echo "created=true"    >> "$GITHUB_OUTPUT"
          fi

      - name: Append failed-step logs to the issue
        if: steps.bot_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          ISSUE: ${{ steps.issue.outputs.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # gh run view --log-failed prints only failed-step output. Cap at
          # the last ~400 lines so giant test outputs don't blow up the
          # comment body or the prompt context.
          gh run view "${RUN_ID}" --log-failed > "$tmp" 2>&1 || true
          tail_lines=400
          tail -n "${tail_lines}" "$tmp" > "${tmp}.tail"
          {
            echo "<!-- ci-failure-attempt run-${RUN_ID} -->"
            echo "### CI failure: run [${RUN_ID}](${RUN_URL})"
            echo
            echo "Tail (\`last ${tail_lines}\` lines) of failed-step logs:"
            echo
            echo '```'
            cat "${tmp}.tail"
            echo '```'
          } > "${tmp}.comment"
          gh issue comment "${ISSUE}" --body-file "${tmp}.comment"

      - name: Per-SHA attempt cap (max 5)
        if: steps.bot_check.outputs.skip != 'true'
        id: cap
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          # Count attempt markers on the issue. Each watcher-fired comment
          # carries `<!-- ci-failure-attempt run-... -->`; that's our
          # canonical attempt counter (it's what gets logged regardless of
          # whether Claude was actually invoked, so reruns of the same
          # failing SHA still count).
          count="$(gh issue view "${ISSUE}" --json comments \
              --jq '[.comments[] | select(.body | contains("<!-- ci-failure-attempt"))] | length')"
          echo "Attempt comments on issue #${ISSUE}: ${count}"
          if [[ "${count}" -gt 5 ]]; then
            gh issue comment "${ISSUE}" --body \
              "Per-SHA attempt cap (5) reached on this SHA. Watcher will not invoke Claude again. @HandelSim please review."
            echo "should_invoke=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_invoke=true"  >> "$GITHUB_OUTPUT"
          fi

  failure_invoke_claude:
    name: Auto-fix on failure (invoke Claude)
    needs: failure_triage
    if: needs.failure_triage.outputs.should_invoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          ref: dev

      - name: Run Claude (auto-fix mode)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_WORKFLOW_PAT }}
          base_branch: dev
          branch_prefix: 'agent/'
          track_progress: true
          prompt: |
            A CI test failed on `dev`. Operate per the
            "When triggered by a CI failure (label: `ci-failure`)"
            section of CLAUDE.md.

            Context:
            - Issue: #${{ needs.failure_triage.outputs.issue_number }}
            - Repository: ${{ github.repository }}
            - Dev SHA at failure: ${{ needs.failure_triage.outputs.sha }} (`${{ needs.failure_triage.outputs.sha7 }}`)
            - Failed CI run: ${{ needs.failure_triage.outputs.run_url }}

            The issue body and its comments contain the failed-step logs
            from the watcher. Investigate (read code, search the web, run
            targeted tests locally as needed), fix the underlying problem,
            push to `dev` via the standard rebase + `--ff-only` flow, and
            close the issue with a fix summary, commit SHA, and link to
            the originally-failing run.

            If after full investigation the failure falls into the
            "Must fall back to research-and-propose" list (security-relevant
            code, public API change, multiple plausible root causes after
            investigation, etc.), comment your proposal on the issue and
            stop — do not push.

            The 5-attempt-per-SHA cap is enforced upstream by the watcher,
            but you should still self-cap as instructed in CLAUDE.md.
          claude_args: |
            --model claude-opus-4-7
            --dangerously-skip-permissions
            --allowedTools "Bash,Read,Edit,Write,MultiEdit,Glob,Grep,WebFetch,WebSearch,Task,TodoWrite,NotebookRead,NotebookEdit"
