# harness — service composition.
#
# All services share a single user-defined bridge network (`harness-net`) so
# they reach each other by service name. The hostname `proxy` is load-bearing:
# opencode's provider baseURL points at http://proxy:${PROXY_PORT}/v1, so
# renaming the proxy service requires updating that URL (built by the agent
# entrypoint) to match.
#
# The .env file lives at the install root (the same directory as this file —
# the install root IS the git clone). Runtime state (volume contents) lives
# under ./state/. Invoke with: docker compose --env-file ./.env up

networks:
  harness-net:
    driver: bridge

services:
  # -------------------------------------------------------------------------
  # proxy — exposes an OpenAI-compatible chat-completions endpoint that
  # opencode talks to directly, translates to/from the upstream's wire
  # format, injects cooperative tool-use prompts, and parses tool calls back
  # from the upstream's response.
  # -------------------------------------------------------------------------
  proxy:
    build:
      # Repo root context so the Dockerfile can COPY firewall/ scripts.
      context: .
      dockerfile: proxy/Dockerfile
    image: harness-proxy:latest
    environment:
      PROXY_API_URL: ${PROXY_API_URL:-}
      PROXY_API_KEY: ${PROXY_API_KEY:-}
      # Fallback model when a request omits one; the proxy otherwise forwards
      # whatever model the request asked for (passthrough).
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-}
      PROXY_HOST: ${PROXY_HOST:-0.0.0.0}
      PROXY_PORT: ${PROXY_PORT:-8000}
      PROXY_TIMEOUT: ${PROXY_TIMEOUT:-180}
      # OUTPUT_DIR is optional — empty by default (no debug dumps).
      # Users opt in by setting OUTPUT_DIR=/output in .env, then bind-mount
      # the host path of their choice via the volume below.
      OUTPUT_DIR: ${OUTPUT_DIR:-}
      # Cooperative-prompt injection mode is NOT set here on purpose. The proxy
      # defaults to "hybrid" on its own; `harness start/restart --prompt-mode
      # <mode>` injects PROXY_PROMPT_MODE for a benchmark/power launch via the
      # runtime override. Interpolating it here would let a stale .env value
      # silently override the default, which is exactly what we removed.
      # Host OS family (linux/macos/windows) the user runs harness from; the
      # harness CLI exports it via harness_detect_os. The proxy injects it into
      # the hybrid recency reminder so agents give host-appropriate,
      # reproducible setup advice. Defaults to unknown (suppresses the host-OS
      # hint) when harness isn't the launcher.
      HARNESS_HOST_OS: ${HARNESS_HOST_OS:-unknown}
      # Consolidated per-tool recency descriptions for ENABLED MCPs: a JSON
      # object keyed `<server>_<tool>`. The harness CLI builds it from each
      # MCP's recency.json (cmd_start -> mcp_tool_recency_json) and exports it;
      # the proxy loads it into the hybrid recency reminder so MCP tools carry a
      # one-line hint instead of a bare signature. Empty when no MCP is enabled.
      HARNESS_MCP_TOOL_RECENCY: ${HARNESS_MCP_TOOL_RECENCY:-}
    volumes:
      # When OUTPUT_DIR is set, the proxy writes per-request debug files here.
      # On Windows users should set OUTPUT_DIR=//output to bypass MSYS path
      # translation; both forms resolve to this same host directory.
      - ./state/output:/output
      # Universal egress firewall reads its allowlist from this path.
      - ${HARNESS_ALLOWLIST_PATH:-./.harness-allowlist}:/etc/harness/allowlist:ro
    # init-firewall.sh requires NET_ADMIN and NET_RAW to manage iptables/ipset.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # The firewall is IPv4-only (iptables + `dig +short A` + an inet ipset), so
    # disable the kernel IPv6 stack to close the unfiltered v6 egress path and
    # stop dualstack hosts' AAAA records from drawing an unroutable IPv6
    # connect attempt (instant ENETUNREACH). Must be set at creation: /proc/sys
    # is read-only inside the running container even with NET_ADMIN.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    networks:
      - harness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PROXY_PORT:-8000}/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  # -------------------------------------------------------------------------
  # Unified agent service. Excluded from default compose operations via the
  # `agent` profile so `docker compose up` doesn't try to start it. The
  # entrypoint dispatches on a mode arg (opencode / shell) so a
  # single image and a single bind-mounted home backs all agent invocations.
  # -------------------------------------------------------------------------
  agent:
    build:
      # Repo root context so the Dockerfile can COPY firewall/ scripts.
      context: .
      dockerfile: agents/Dockerfile
    image: harness-agent:latest
    # Agents are launched ephemerally via `harness <mode>` (docker run), but
    # we still declare cap_add + the allowlist mount here so that
    # `docker compose up agent` works for debugging and so the runtime
    # contract is documented in one place. The harness CLI applies the same
    # set on its docker run call.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # IPv4-only firewall ⇒ disable the kernel IPv6 stack. See proxy above.
    # The harness CLI passes the matching --sysctl on its docker run call.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    volumes:
      - ${HARNESS_ALLOWLIST_PATH:-./.harness-allowlist}:/etc/harness/allowlist:ro
    networks:
      - harness-net
    profiles:
      - agent
    # No restart policy: agents are ephemeral, launched per-invocation by
    # the `harness` script via `docker run`.
