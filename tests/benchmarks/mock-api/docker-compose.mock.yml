# Compose overlay that adds a mock upstream API to the harness-net network
# so the proxy can be pointed at it without any real upstream credentials.
#
# Usage (from the repo root):
#   docker compose --env-file ./.env \
#     -f docker-compose.yml \
#     -f tests/benchmarks/mock-api/docker-compose.mock.yml \
#     up -d
#
# Point .env at it:
#   PROXY_API_URL=http://mock-api:80/v1/chat/completions
#   PROXY_API_KEY=mock-key
#   PROXY_API_MODEL=mock-model
#
# The firewall treats bare (dot-less) hostnames as intra-cluster and skips
# the allowlist check — see firewall/init-firewall.sh. No allowlist edits
# required.

services:
  mock-api:
    build:
      context: ./tests/benchmarks/mock-api
      dockerfile: Dockerfile
    image: harness-mock-api:latest
    environment:
      MOCK_DEFAULT_CONTENT: ${MOCK_DEFAULT_CONTENT:-Task acknowledged. Done.}
      MOCK_SCRIPT_FILE: ${MOCK_SCRIPT_FILE:-}
      MOCK_LOG_REQUESTS: ${MOCK_LOG_REQUESTS:-1}
      MOCK_PORT: "80"
    volumes:
      # Optional: bind a script file in if MOCK_SCRIPT_FILE references one.
      - ./tests/benchmarks/mock-api:/app:ro
    networks:
      - harness-net
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s
