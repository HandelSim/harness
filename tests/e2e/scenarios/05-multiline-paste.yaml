name: 05-multiline-paste
inventory_refs: [F043, F051]
# Tracked in #37. Same root cause as scenario 03: the post-paste Enter
# triggers a real /api/chat call; the placeholder upstream 404s; proxy 502s;
# wait_stable_ms times out waiting for the TUI to settle.
expected_failure: true
expected_failure_reason: "no mock upstream wired in CI; post-paste Enter triggers real /api/chat that placeholder upstream 404s (#37)"
description: |
  Paste a multi-line block into the claude TUI via bracketed paste and
  verify the TUI treats it as ONE input (i.e. submitting once produces a
  single response rather than one-per-line). Print-mode (`-p`) cannot
  exercise this because it never goes through the interactive paste path.

  Inventory refs:
    - F043 — `harness claude` is the launcher whose interactive paste
             handling we're testing
    - F051 — `harness claude -p` is the alternative print-mode path that
             does NOT exercise this code, justifying why this test is
             tmux-driven rather than CLI-scripted

setup:
  env:
    TERM: xterm-256color
    PROXY_API_URL: http://127.0.0.1:9000
    PROXY_API_KEY: test-key
    PROXY_API_MODEL: claude-sonnet-4-5
  tmux:
    width: 200
    height: 50
  default_timeout_s: 30

steps:
  - launch: "./harness claude"
    wait_for_marker: "❯"
    timeout_s: 90

  # Bracketed paste of a 3-line snippet. The runner's `paste` step uses
  # tmux load-buffer + paste-buffer, which triggers the bracketed-paste
  # escapes a TUI inspects to distinguish typed input from a paste.
  - paste: |
      line one of the paste
      line two of the paste
      line three of the paste
    # Do not submit yet — assert all three lines are visible in the
    # buffer area before pressing Enter.
    wait_stable_ms: 500
    timeout_s: 10

  - capture_assertions:
      - contains: "line one of the paste"
      - contains: "line two of the paste"
      - contains: "line three of the paste"

  # Now submit and wait for a response.
  - send_key: Enter
    wait_for_marker: "❯"
    wait_stable_ms: 800
    timeout_s: 90

  - capture_assertions:
      - not_contains: "Traceback"
      - not_contains: "Error:"

  - send_key: C-c
    wait_stable_ms: 300
  - send_key: C-d
    wait_stable_ms: 500

cleanup:
  kill_session: true
  archive_transcript: true
