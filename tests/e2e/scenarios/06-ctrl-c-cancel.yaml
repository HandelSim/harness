name: 06-ctrl-c-cancel
inventory_refs: [P051, F043]
description: |
  Start a long streaming response, send Ctrl-C mid-stream, verify the
  TUI cancels cleanly: no error spew, no hung state, prompt returns and
  accepts a follow-up input.

  Inventory refs:
    - P051 — streaming requests yield NDJSON deltas (the path being cancelled)
    - F043 — `harness claude` is the launcher hosting the interactive cancel UX

setup:
  env:
    TERM: xterm-256color
    PROXY_API_URL: http://127.0.0.1:9000
    PROXY_API_KEY: test-key
    PROXY_API_MODEL: claude-sonnet-4-5
    MOCK_SCENARIO: text
  tmux:
    width: 200
    height: 50
  default_timeout_s: 30

steps:
  - launch: "./harness claude"
    wait_for_marker: "❯ "
    timeout_s: 90

  # Send a prompt that's likely to produce a long streaming response so
  # the cancel arrives mid-stream.
  - paste: "Write an extremely long, multi-paragraph essay about distributed systems failure modes, with lots of detail."
    send_key: Enter
    # Give the response a moment to actually start streaming before we cancel.
    wait_stable_ms: 200
    timeout_s: 10

  # A short sleep to ensure deltas have begun arriving in the pane. We
  # don't want to send C-c before the request has even left the wire.
  - sleep_s: 1.0

  # Cancel.
  - send_key: C-c
    wait_for_marker: "❯ "
    wait_stable_ms: 800
    timeout_s: 30

  # Post-cancel: the prompt is back, no traceback, no error spew. Inside
  # claude's TUI Ctrl-C-during-stream usually prints something like
  # "Interrupted" or "Cancelled"; we don't assert the exact string
  # because the wording is version-dependent.
  - capture_assertions:
      - not_contains: "Traceback"
      - not_contains: "Error:"
      - not_contains: "panic:"
      - regex_match: "❯ "

  # Smoke: send a follow-up to prove the TUI is not hung.
  - paste: "ok"
    send_key: Enter
    wait_for_marker: "❯ "
    wait_stable_ms: 500
    timeout_s: 30

  - capture_assertions:
      - not_contains: "Traceback"

  - send_key: C-c
    wait_stable_ms: 300
  - send_key: C-d
    wait_stable_ms: 500

cleanup:
  kill_session: true
  archive_transcript: true
