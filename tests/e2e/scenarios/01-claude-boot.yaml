name: 01-claude-boot
inventory_refs: [F043, F001]
description: |
  Boot `harness claude` in TUI mode, wait for the prompt to render,
  then exit cleanly via Ctrl-C / Ctrl-D. Pane must not contain any
  Error/Traceback noise after boot.

  Inventory refs:
    - F043 — `harness claude` launches the agent container in claude mode
    - F001 — invoking the wrapper with no extra args prints help / boots cleanly

setup:
  env:
    TERM: xterm-256color
    # mock upstream so no real LLM calls happen even if the agent reaches out
    PROXY_API_URL: http://127.0.0.1:9000
    PROXY_API_KEY: test-key
    PROXY_API_MODEL: claude-sonnet-4-5
  tmux:
    width: 200
    height: 50
  default_timeout_s: 30

steps:
  # Boot the TUI. We can't wait_for_marker on the launch step because on a
  # greenfield agent home claude-code shows a theme picker / onboarding
  # screen that hides the prompt — wait_for_marker would time out. Wait
  # for the pane to stabilize after launch instead, then dismiss any
  # picker, then look for the prompt marker.
  - launch: "./harness claude"
    wait_stable_ms: 1500
    timeout_s: 45

  # Dismiss theme picker / onboarding confirmation pages if present. CI
  # pre-seeds state/agent/home/.claude/settings.json with
  # hasCompletedOnboarding=true so these are usually no-ops, but the
  # defense-in-depth Enter taps cover claude-code versions where the
  # picker fires regardless. If the prompt is already up, Enter just
  # submits an empty line which claude ignores.
  - send_key: Enter
    wait_stable_ms: 500
    timeout_s: 5
  - send_key: Enter
    wait_for_marker: "│ > "
    timeout_s: 30

  # Settle: nothing should still be scrolling.
  - sleep_s: 0.5

  # Boot-time assertions.
  - capture_assertions:
      - not_contains: "Traceback"
      - not_contains: "Error:"
      - regex_match: "│ > "

  # Exit cleanly via Ctrl-C twice (claude convention) or Ctrl-D.
  - send_key: C-c
    wait_stable_ms: 300
    timeout_s: 10
  - send_key: C-d
    wait_stable_ms: 500
    timeout_s: 10

  # Post-exit: pane should not contain a panic / traceback.
  - capture_assertions:
      - not_contains: "Traceback"
      - not_contains: "panic:"

cleanup:
  kill_session: true
  archive_transcript: true
