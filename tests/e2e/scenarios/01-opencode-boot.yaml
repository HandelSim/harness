name: 01-opencode-boot
inventory_refs: [F044, A018]
description: |
  Boot `harness opencode` (equivalently bare `harness`), wait for its TUI
  banner to appear, exit cleanly.

  Inventory refs:
    - F044 — `harness opencode` launches the agent container in opencode mode
    - A018 — `ensure_opencode_config` writes opencode.json on every launch
      (boot path exercises the config-write side-effect)

setup:
  env:
    TERM: xterm-256color
    PROXY_API_URL: http://127.0.0.1:9000
    PROXY_API_KEY: test-key
    PROXY_API_MODEL: ci-placeholder-model
  tmux:
    width: 200
    height: 50
  default_timeout_s: 30

steps:
  # Boot opencode. opencode enters an alternate-screen TUI right after the
  # harness banner is printed — once that happens, `tmux capture-pane -p`
  # no longer sees the pre-TUI scrollback (firewall init lines, banner).
  # That makes post-launch text assertions unreliable: they can't see the
  # harness banner anymore, and the TUI's own glyphs are tricky to match.
  # Cycle 7 also showed the tmux session occasionally dying ~16s after
  # launch (likely opencode quitting on first-run when its model backend
  # is unreachable), which makes any further capture call fail outright.
  #
  # Scope this scenario to the minimum that's reliably testable: confirm
  # the harness banner printed (which means firewall init succeeded and
  # the agent container started opencode), then send Ctrl-C to interrupt.
  # We do NOT poll-capture after that point — the opencode TUI exit path
  # and any tmux session death would cause a spurious capture-pane error.
  - launch: "./harness opencode"
    wait_for_marker: "harness-agent (opencode)"
    timeout_s: 90

  - send_key: C-c

cleanup:
  kill_session: true
  archive_transcript: true
